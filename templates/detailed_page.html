{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic Visual Asset Generator | Results</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <script src="{% static 'dependencies/jszip.min.js' %}"></script>
</head>
<body>
    <nav class="navbar">
        <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
            <h2 onclick="window.location.href='/'" style="cursor:pointer">Semantic Visual Asset Generator</h2>
            <button id="download-zip-btn" class="btn-success">Download Selected Assets (ZIP)</button>
        </div>
    </nav>

    <main class="container">
        <header class="detail-info-header">
            <h1 id="display-title">Loading Project Assets...</h1>
            <div style="display: flex; gap: 10px; align-items: center;">
                <span id="display-meta" class="badge"></span>
                <p id="display-date" style="margin: 0; color: var(--text-muted); font-size: 0.9rem;"></p>
            </div>
        </header>

        <div id="scenes-root">
            </div>
    </main>

    <script>
        // pk is passed from the Django view: path('project/<int:pk>/', ...)
        const SCRIPT_ID = "{{ pk }}"; 
        const CSRF_TOKEN = "{{ csrf_token }}";
    </script>
    <script src="{% static 'js/detail.js' %}"></script>
</body>
</html>
