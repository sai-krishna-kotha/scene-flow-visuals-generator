{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic Visual Asset Generator | Dashboard</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <script src="{% static 'dependencies/jszip.min.js' %}"></script>
    <style>
        /* Profile Layout Utilities */
        .navbar-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }
        .user-profile-widget {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: rgba(255,255,255,0.1);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
        }
        .profile-badge {
            background-color: #2563eb;
            color: #fff;
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.8rem;
        }
        .logout-link {
            color: #ef4444;
            text-decoration: none;
            cursor: pointer;
            font-weight: 500;
        }
        .logout-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container navbar-flex">
            <h2 id="nav-logo" style="cursor:pointer">Semantic Visual Asset Generator</h2>
            
            <!-- NEW: Dynamic User Profile Container -->
            <div class="user-profile-widget">
                <span>Creator: <strong id="profile-username">...</strong></span>
                <span class="profile-badge">Generations: <span id="profile-count">0</span></span>
                <span>|</span>
                <a onclick="triggerLogout()" class="logout-link">Logout</a>
            </div>
        </div>
    </nav>

    <main class="container">
        <div id="view-dashboard" style="display:none">
            <section class="card creation-form">
                <h3>Generate New Visual Assets</h3>
                <input type="text" id="script-title" placeholder="Project Title (e.g., Autumn Marketing Campaign)">
                <textarea id="script-text" placeholder="Enter your full script or scene descriptions here..."></textarea>
                <div class="form-flex">
                    <select id="orientation-input">
                        <option value="all">All Orientations</option>
                        <option value="landscape">Landscape (16:9)</option>
                        <option value="portrait">Portrait (9:16)</option>
                    </select>
                    <button id="submit-btn" class="btn-primary">Generate Assets</button>
                </div>
            </section>

            <section class="history-section">
                <div class="header-flex">
                    <h3>Recent Asset Generations</h3>
                    <input type="text" id="search-input" placeholder="Search by project title..." onkeyup="searchScripts()">
                </div>
                <div id="scripts-grid" class="grid"></div>
                <div class="pagination-area">
                    <button id="load-more-btn" class="btn-secondary" style="display:none">Load More Past Scripts</button>
                </div>
            </section>
        </div>

        <div id="view-detail" style="display:none">
            <div class="detail-header">
                <div>
                    <h2 id="display-title">Processing Assets...</h2>
                    <span id="display-meta" class="badge"></span>
                </div>
                <button id="download-zip-btn" class="btn-success">Download Selected Assets (ZIP)</button>
            </div>
            <div id="scenes-root"></div>
        </div>
    </main>

    <script>
        const CSRF_TOKEN = "{{ csrf_token }}";

        // Fetch and map user profile information on load
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch('/api/profile/');
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('profile-username').innerText = data.username;
                    document.getElementById('profile-count').innerText = data.total_generations;
                }
            } catch (err) {
                console.error("Error loading user profile widget stats:", err);
            }
        });

        // Trigger safe session logout
        async function triggerLogout() {
            if(!confirm("Are you sure you want to log out, bro?")) return;
            try {
                const response = await fetch('/api/logout/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': CSRF_TOKEN
                    }
                });
                if(response.ok) {
                    window.location.href = '/login/';
                }
            } catch (err) {
                console.error("Logout error:", err);
            }
        }
    </script>
    <script src="{% static 'js/script.js' %}"></script>
</body>
</html>
