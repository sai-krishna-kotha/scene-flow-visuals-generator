{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic Visual Asset Generator | Dashboard</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <script src="{% static 'dependencies/jszip.min.js' %}"></script>
    <style>
        .navbar-flex { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        /* Clean Icon Styling */
        .profile-nav-trigger {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            color: #fff;
            background: rgba(255, 255, 255, 0.15);
            padding: 0.5rem 1.2rem;
            border-radius: 20px;
            font-weight: 500;
            transition: background 0.2s ease;
        }
        .profile-nav-trigger:hover {
            background: rgba(255, 255, 255, 0.25);
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container navbar-flex">
            <h2 id="nav-logo" onclick="switchView('dashboard')" style="cursor:pointer">Semantic Visual Asset Generator</h2>
            
            <!-- NEW: Clean, Minimal Profile Entrypoint -->
            <a href="/profile/" class="profile-nav-trigger">
                <span>👤</span>
                <span>{{ request.user.username }}</span>
            </a>
        </div>
    </nav>

    <main class="container">
        <!-- VIEW 1: PROCESSING DASHBOARD -->
        <div id="view-dashboard" style="display:block">
            <section class="card creation-form">
                <h3>Generate New Visual Assets</h3>
                <input type="text" id="script-title" placeholder="Project Title (e.g., Autumn Marketing Campaign)">
                <textarea id="script-text" placeholder="Enter your full script or scene descriptions here..."></textarea>
                <div class="form-flex">
                    <select id="orientation-input">
                        <option value="all">All Orientations</option>
                        <option value="landscape">Landscape (16:9)</option>
                        <option value="portrait">Portrait (9:16)</option>
                    </select>
                    <button id="submit-btn" class="btn-primary">Generate Assets</button>
                </div>
            </section>

            <section class="history-section">
                <div class="header-flex">
                    <h3>Recent Asset Generations</h3>
                    <input type="text" id="search-input" placeholder="Search by project title..." onkeyup="searchScripts()">
                </div>
                <div id="scripts-grid" class="grid"></div>
                <div class="pagination-area">
                    <button id="load-more-btn" class="btn-secondary" style="display:none">Load More Past Scripts</button>
                </div>
            </section>
        </div>

        <!-- VIEW 2: STORYBOARD DETAILS -->
        <div id="view-detail" style="display:none">
            <div class="detail-header">
                <div>
                    <h2 id="display-title">Processing Assets...</h2>
                    <span id="display-meta" class="badge"></span>
                </div>
                <button id="download-zip-btn" class="btn-success">Download Selected Assets (ZIP)</button>
            </div>
            <div id="scenes-root"></div>
        </div>
    </main>

    <script>
        const CSRF_TOKEN = "{{ csrf_token }}";

        function switchView(viewName) {
            document.getElementById('view-dashboard').style.display = 'none';
            document.getElementById('view-detail').style.display = 'none';

            if (viewName === 'dashboard') {
                document.getElementById('view-dashboard').style.display = 'block';
                if(typeof loadDashboard === 'function') loadDashboard();
            } else if (viewName === 'detail') {
                document.getElementById('view-detail').style.display = 'block';
            }
        }
    </script>
    <script src="{% static 'js/script.js' %}"></script>
</body>
</html>
