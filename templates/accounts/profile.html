{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asset Generator | Creator Profile</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        .navbar-flex { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .profile-container { display: grid; grid-template-columns: 1fr 2fr; gap: 2rem; margin-top: 2rem; }
        @media(max-width: 768px) { .profile-container { grid-template-columns: 1fr; } }
        
        /* Stats Widget Card */
        .meta-card { text-align: center; padding: 2rem; background: #fafafa; border: 1px solid #eaeaea; }
        .avatar-circle { width: 80px; height: 80px; background: #2563eb; color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; margin: 0 auto 1rem; }
        .stat-box { background: #fff; padding: 1rem; border-radius: 8px; border: 1px solid #eee; margin-top: 1rem; }
        .stat-number { font-size: 1.8rem; font-weight: bold; color: #2563eb; display: block; }
        
        /* Settings Forms Card */
        .settings-card { padding: 2rem; margin-bottom: 1.5rem; }
        .settings-card label { display: block; margin-bottom: 0.4rem; font-weight: 500; font-size: 0.9rem; }
        .settings-card input, .settings-card select { width: 100%; padding: 0.7rem; margin-bottom: 1.2rem; border: 1px solid #ccc; border-radius: 4px; }
        
        .btn-danger { background-color: #ef4444; color: white; border: none; width: 100%; padding: 0.8rem; margin-top: 1rem; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .btn-danger:hover { background-color: #dc2626; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container navbar-flex">
            <h2 id="nav-logo" onclick="window.location.href='/'" style="cursor:pointer">Semantic Visual Asset Generator</h2>
            <button onclick="window.location.href='/'" class="btn-secondary" style="color: white; border-color: white;">Back to Studio</button>
        </div>
    </nav>

    <main class="container profile-container">
        <!-- LEFT COLUMN: Account Information & Live Platform Metrics -->
        <aside class="card meta-card">
            <div class="avatar-circle">👤</div>
            <h3 id="meta-username">Loading...</h3>
            <p style="font-size: 0.85rem; color:#777;" id="meta-joined">Joined: --</p>
            
            <div class="stat-box">
                <span class="stat-number" id="meta-generations">0</span>
                <span style="font-size: 0.85rem; color:#555; font-weight:500;">Total Storyboards Generated</span>
            </div>

            <button onclick="triggerLogout()" class="btn-danger">Secure Log Out</button>
        </aside>

        <!-- RIGHT COLUMN: Integration and Account Modification Modules -->
        <section style="display: flex; flex-direction: column; gap: 0.5rem;">
            <!-- Module 1: Personal Credentials -->
            <div class="card settings-card">
                <h3>Identity Configurations</h3>
                <hr style="margin-bottom: 1.2rem; opacity: 0.15;">
                <label>First Name</label>
                <input type="text" id="setting-first-name">
                <label>Last Name</label>
                <input type="text" id="setting-last-name">
                <label>Email Address</label>
                <input type="email" id="setting-email">
                
                <label>Default Output Aspect Ratio</label>
                <select id="setting-orientation">
                    <option value="all">All Orientations</option>
                    <option value="landscape">Landscape (16:9)</option>
                    <option value="portrait">Portrait (9:16)</option>
                </select>
                <button onclick="saveProfileSettings()" class="btn-primary">Commit Identity Changes</button>
            </div>

            <!-- Module 2: Developer Port API Key management -->
            <div class="card settings-card">
                <h3>Integration Gateway Credentials</h3>
                <p style="font-size: 0.85rem; color:#666; margin-bottom: 1rem;">Input custom engine credentials to bypass global extraction quotas.</p>
                <label>Pexels Developer Token</label>
                <input type="password" id="setting-pexels-key">
                <label>Pixabay Integration Key</label>
                <input type="password" id="setting-pixabay-key">
                <button onclick="saveProfileSettings()" class="btn-success">Update Security Tokens</button>
            </div>

            <!-- Module 3: Security & Cipher Management -->
            <div class="card settings-card">
                <h3>Access Security Controls</h3>
                <hr style="margin-bottom: 1.2rem; opacity: 0.15;">
                <label>Current Account Password</label>
                <input type="password" id="pass-old">
                <label>New Secret Cipher</label>
                <input type="password" id="pass-new">
                <button onclick="savePasswordReset()" class="btn-secondary">Modify Account Password</button>
            </div>
        </section>
    </main>

    <script>
        const CSRF_TOKEN = "{{ csrf_token }}";

        // Pull full system and metadata properties on component mount
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch('/api/profile/settings/');
                if (response.ok) {
                    const data = await response.json();
                    
                    // Populate Profile Metadata Left Column
                    document.getElementById('meta-username').innerText = data.username;
                    document.getElementById('meta-joined').innerText = `Member Since: ${data.date_joined || 'Recent'}`;
                    document.getElementById('meta-generations').innerText = data.total_generations;

                    // Populate Input Form Fields Right Column
                    document.getElementById('setting-first-name').value = data.first_name || '';
                    document.getElementById('setting-last-name').value = data.last_name || '';
                    document.getElementById('setting-email').value = data.email || '';
                    document.getElementById('setting-orientation').value = data.default_orientation;
                    document.getElementById('setting-pexels-key').value = data.pexels_key || '';
                    document.getElementById('setting-pixabay-key').value = data.pixabay_key || '';
                }
            } catch (err) { console.error("Error loading profile configuration layer.", err); }
        });

        async function saveProfileSettings() {
            const payload = {
                first_name: document.getElementById('setting-first-name').value,
                last_name: document.getElementById('setting-last-name').value,
                email: document.getElementById('setting-email').value,
                default_orientation: document.getElementById('setting-orientation').value,
                pexels_key: document.getElementById('setting-pexels-key').value,
                pixabay_key: document.getElementById('setting-pixabay-key').value,
            };

            const response = await fetch('/api/profile/settings/', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRF_TOKEN },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                alert("Profile modifications updated successfully, bro!");
                window.location.reload(); // Refresh to catch changes and recalculate metadata counts
            } else { alert("Failed to save changes."); }
        }

        async function savePasswordReset() {
            const old_password = document.getElementById('pass-old').value;
            const new_password = document.getElementById('pass-new').value;

            if(!old_password || !new_password) return alert("Please fill out password verification targets.");

            const response = await fetch('/api/profile/password/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRF_TOKEN },
                body: JSON.stringify({ old_password, new_password })
            });

            if (response.ok) {
                alert("Account verification credentials reset perfectly.");
                document.getElementById('pass-old').value = '';
                document.getElementById('pass-new').value = '';
            } else {
                const data = await response.json();
                alert(data.error || "Password modification error.");
            }
        }

        async function triggerLogout() {
            if(!confirm("Ready to sign out of the asset workstation, bro?")) return;
            const response = await fetch('/api/logout/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRF_TOKEN }
            });
            if(response.ok) window.location.href = '/login/';
        }
    </script>
</body>
</html>
